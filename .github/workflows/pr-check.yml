name: pr-check
on:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-databricks
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: dbt parse
        working-directory: dbt
        env:
          DBT_HOST: example.cloud.databricks.com
          DBT_HTTP_PATH: /sql/1.0/warehouses/placeholder
          DBT_TOKEN: placeholder
        run: dbt parse --profiles-dir ci
