name: dbt-build
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DBT_HOST: ${{ secrets.DBT_HOST }}
      DBT_HTTP_PATH: ${{ secrets.DBT_HTTP_PATH }}
      DBT_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-databricks
      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir ci
      - name: dbt docs
        working-directory: dbt
        run: dbt docs generate --static --profiles-dir ci
      - run: mkdir site && cp dbt/target/static_index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
