version: 2
sources:
  - name: silver
    database: workspace
    schema: gh_archive
    tables:
      - name: silver_events
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after: {count: 3, period: hour}
            error_after: {count: 12, period: hour}
        columns:
          - name: event_id
            data_tests: [unique, not_null]
